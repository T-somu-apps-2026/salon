<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ちょきちょき美容室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
/* Layout: two screens — customer picker (2x2 cards), then a mirror with the customer and a tool tray. Single bright salon theme by choice. */
:root{
  --bg:#ffeef3; --paper:#ffffff; --ink:#3b2a20; --mirror:#c98b5a; --mirror-in:#f4fbff;
  --btn:#ffe08a; --btn-on:#ff9fbf; --done:#5fc96b; --shadow:rgba(59,42,32,.18);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.screen{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:560px;margin:0 auto;box-sizing:border-box}
h1{margin:4px 0 0;text-align:center;font-size:26px;font-weight:800;text-wrap:balance}
.lead{margin:0;text-align:center;font-size:17px}
.cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:8px 6px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 var(--shadow);font-family:var(--font);color:var(--ink)}
.card canvas{width:100%;max-width:150px;aspect-ratio:300/380;height:auto}
.card span{font-size:18px;font-weight:800}
.top{display:flex;align-items:center;gap:8px}
.top .name{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--font);font-weight:800;font-size:16px;padding:9px 16px;border-radius:999px;border:3px solid var(--ink);
  background:var(--btn);color:var(--ink);box-shadow:0 4px 0 var(--shadow);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--btn-on)}
.pill.done{background:var(--done);color:#fff;font-size:18px}
.mirror{flex:1;min-height:0;background:var(--mirror);border-radius:40px;padding:10px;box-shadow:0 6px 0 var(--shadow);position:relative;display:flex}
.glass{flex:1;min-height:0;background:var(--mirror-in);border-radius:32px;position:relative;overflow:hidden;display:grid;place-items:center}
#cv{touch-action:none;display:block}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{font-family:var(--font);border:3px solid var(--ink);border-radius:18px;background:var(--btn);color:var(--ink);cursor:pointer;
  padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--shadow)}
.tool b{font-size:28px;line-height:1.1}
.tool small{font-size:11px;font-weight:800;white-space:nowrap}
.tool[aria-pressed="true"]{background:var(--btn-on);transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
button:focus-visible{outline:4px solid #4a90e2;outline-offset:3px}
.fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding-top:14px;pointer-events:none}
.fin h2{margin:0;font-size:34px;color:#ff5a8a;font-weight:800;text-shadow:0 3px 0 #fff}
.fin .row{display:flex;gap:8px;pointer-events:auto;position:absolute;bottom:14px}
.yay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.yay span{position:absolute;top:-40px;font-size:30px;animation:fall 2s ease-out forwards}
@keyframes fall{to{transform:translateY(560px) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.yay span{animation:none}}
</style>
</head>
<body>

<section class="screen" id="pick">
  <h1>ちょきちょき美容室</h1>
  <p class="lead">きょうの おきゃくさんは だれかな？</p>
  <div style="display:flex;justify-content:center"><button class="pill musicbtn" id="music1" type="button" aria-pressed="false">♪ おんがく</button></div>
  <div class="cards" id="cards"></div>
</section>

<section class="screen" id="play" hidden>
  <div class="top">
    <button class="pill" id="back" type="button">もどる</button>
    <div class="name" id="cname"></div>
    <button class="pill musicbtn" id="music2" type="button" aria-pressed="false" aria-label="おんがく">♪</button>
    <button class="pill done" id="finish" type="button">かんせい！</button>
  </div>
  <div class="mirror"><div class="glass" id="glass">
    <canvas id="cv"></canvas>
    <div class="yay" id="yay"></div>
    <div class="fin" id="fin" hidden>
      <h2>かんせい！</h2>
      <div class="row">
        <button class="pill" id="again" type="button">もういちど</button>
        <button class="pill" id="other" type="button">ほかの おきゃくさん</button>
      </div>
    </div>
  </div></div>
  <div class="tools" id="tools"></div>
</section>

<script>
const W=300,H=380,CX=150,CY=150,FRX=62,FRY=72,STEP=6,HALF=Math.PI/2;
const CUST=[
 {name:'おねえさん',hair:'#8a5530',wet:'#4e2c14',skin:'#ffdcc4',cape:'#ff9fbf',back:[48,165,215],bang:[16,22,32],beard:null,lips:true,voice:{p:1.25,r:1}},
 {name:'おんなのこ',hair:'#3f2c20',wet:'#1d120b',skin:'#ffe3cf',cape:'#ffd93b',back:[44,140,180],bang:[18,26,34],beard:null,ribbon:true,cheek:true,voice:{p:1.9,r:1.15}},
 {name:'おとこのこ',hair:'#2f2a27',wet:'#121010',skin:'#ffdcc4',cape:'#7fd3ff',back:[36,55,78],bang:[22,80,95],beard:null,cheek:true,voice:{p:1.55,r:1.15}},
 {name:'おじさん',hair:'#6e5c4b',wet:'#3d3127',skin:'#f6caa8',cape:'#8fd18b',back:[40,100,130],bang:[16,45,60],beard:[28,55,80],voice:{p:.55,r:.95}}
];
const TOOLS=[['shampoo','🧴','シャンプー'],['shower','🚿','シャワー'],['dryer','💨','ドライヤー'],['scissors','✂️','ハサミ'],['razor','🪒','ひげそり']];
const LINES={shampoo:'わーい！',shower:'わぁー！',dryer:'きもちいいー！',razor:'やめて～！'};

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeStrands(c,seed){const r=rng(seed),S=[];
 const [bn,b0,b1]=c.back;
 for(let i=0;i<bn;i++){const th=-Math.PI*(0.04+0.92*i/(bn-1));const side=Math.cos(th)>=0?1:-1;
  S.push({x:CX+FRX*1.04*Math.cos(th),y:CY-8+FRY*1.04*Math.sin(th),a0:th+side*1.15,L0:b0+r()*(b1-b0),layer:'back',side,rate:.085,ph:r()*6})}
 const [fn,f0,f1]=c.bang;
 for(let i=0;i<fn;i++){const th=-Math.PI*(0.2+0.6*i/(fn-1));
  S.push({x:CX+FRX*.82*Math.cos(th),y:CY-8+FRY*.82*Math.sin(th),spread:-Math.cos(th)*.35,L0:f0+r()*(f1-f0),layer:'bang',side:Math.cos(th)>=0?1:-1,rate:.03,ph:r()*6})}
 if(c.beard){const [n,l0,l1]=c.beard;
  for(let i=0;i<n;i++){const th=Math.PI*(0.12+0.76*i/(n-1));
   S.push({x:CX+FRX*.96*Math.cos(th),y:CY+FRY*.9*Math.sin(th),a0:HALF-Math.cos(th)*.5,L0:l0+r()*(l1-l0)*Math.sin(th),layer:'beard',side:Math.cos(th)>=0?1:-1,rate:.03,ph:r()*6})}}
 S.forEach(s=>{s.stage=0;s.flut=0;s.last=0});return S}

let st=null;
function newState(i){return{c:CUST[i],idx:i,strands:makeStrands(CUST[i],i*97+11),bubbles:[],parts:[],pieces:[],
 wet:0,w:0,bangDir:HALF,happy:false,t:0,say:null}}
const len=s=>s.L0*(1-s.stage/5);

// ---- hair geometry ----
function pts(s,S){let a,target,rate=s.rate,L=len(s);
 if(s.layer==='back'){const windward=(S.w>0&&s.side<0)||(S.w<0&&s.side>0);
  a=s.a0;target=HALF-S.w*(windward?1.15:.6);rate*=1+S.wet*1.6}
 else if(s.layer==='bang'){a=S.bangDir+s.spread*(1-S.wet*.7);target=S.bangDir+s.spread*.3;
  if(S.bangDir<0)L=Math.min(L,24)}
 else{a=s.a0;target=HALF-S.w*.35}
 const p=[[s.x,s.y]];let x=s.x,y=s.y,left=L,k=0;
 while(left>0){const d=Math.min(STEP,left);left-=d;k++;
  a+=Math.sin(S.t*.28+s.ph+k*.55)*s.flut*.07;
  let diff=target-a;while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
  a+=Math.max(-rate,Math.min(rate,diff));x+=Math.cos(a)*d;y+=Math.sin(a)*d;p.push([x,y])}
 return p}
function inFront(s,S){return s.layer!=='back'||(Math.abs(S.w)>.35&&((S.w>0&&s.side<0)||(S.w<0&&s.side>0)))}

function strokeStrand(ctx,p,color,wet){if(p.length<2)return;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
 for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);
 ctx.strokeStyle='#3b2a20';ctx.lineWidth=wet>.3?6:7;ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=wet>.3?3.5:4.5;ctx.stroke();
 if(wet>.3){ctx.strokeStyle='rgba(255,255,255,'+(.45*wet)+')';ctx.lineWidth=1.2;ctx.stroke()}}

function mix(a,b,t){const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));
 return'#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*Math.min(1,t)).toString(16).padStart(2,'0')).join('')}

function draw(ctx,S){const c=S.c,hc=mix(c.hair,c.wet,S.wet);
 ctx.lineCap='round';ctx.lineJoin='round';
 ctx.fillStyle=c.skin;ctx.strokeStyle='#3b2a20';ctx.lineWidth=4;
 ctx.beginPath();ctx.rect(CX-22,CY+50,44,50);ctx.fill();ctx.stroke();
 ctx.fillStyle=c.cape;ctx.beginPath();ctx.moveTo(CX-30,CY+95);ctx.quadraticCurveTo(CX-140,CY+110,CX-150,H+10);ctx.lineTo(CX+150,H+10);
 ctx.quadraticCurveTo(CX+140,CY+110,CX+30,CY+95);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(CX,CY+97,34,10,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 S.strands.forEach(s=>{if(len(s)>0&&!inFront(s,S))strokeStrand(ctx,pts(s,S),hc,S.wet)});
 ctx.fillStyle=c.skin;ctx.strokeStyle='#3b2a20';ctx.lineWidth=4;
 [-1,1].forEach(d=>{ctx.beginPath();ctx.ellipse(CX+d*FRX,CY+8,11,15,0,0,Math.PI*2);ctx.fill();ctx.stroke()});
 ctx.beginPath();ctx.ellipse(CX,CY,FRX,FRY,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 // eyes
 ctx.fillStyle='#3b2a20';ctx.strokeStyle='#3b2a20';ctx.lineWidth=4;
 const talking=S.say&&S.say.life>0,sad=!S.happy&&talking&&S.say.sad,joy=S.happy||(talking&&!sad);
 [-1,1].forEach(d=>{const ex=CX+d*23,ey=CY+4;
  if(sad){ctx.beginPath();ctx.moveTo(ex-d*7,ey-6);ctx.lineTo(ex+d*5,ey);ctx.lineTo(ex-d*7,ey+6);ctx.stroke()}
  else if(joy){ctx.beginPath();ctx.arc(ex,ey+3,8,Math.PI*1.15,Math.PI*1.85);ctx.stroke()}
  else{ctx.fillStyle='#3b2a20';ctx.beginPath();ctx.arc(ex,ey,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+2,ey-2,2,0,Math.PI*2);ctx.fill()}});
 if(c.cheek||joy){ctx.fillStyle='rgba(255,120,150,.45)';[-1,1].forEach(d=>{ctx.beginPath();ctx.ellipse(CX+d*38,CY+24,11,7,0,0,Math.PI*2);ctx.fill()})}
 ctx.lineWidth=4;ctx.beginPath();
 if(sad){ctx.fillStyle='#e0507a';ctx.ellipse(CX,CY+36,9,11,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b2a20';ctx.stroke()}
 else if(joy){ctx.fillStyle='#e0507a';ctx.arc(CX,CY+32,12,0,Math.PI);ctx.closePath();ctx.fill();ctx.strokeStyle='#3b2a20';ctx.stroke()}
 else{ctx.strokeStyle=c.lips?'#e0507a':'#3b2a20';ctx.arc(CX,CY+30,10,Math.PI*.15,Math.PI*.85);ctx.stroke()}
 // hair cap (gone when every hair is cut off)
 const hairLeft=S.strands.some(s=>s.layer!=='beard'&&s.stage<5);
 if(hairLeft){const up=S.bangDir<0?Math.min(1,-S.bangDir/HALF):0;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,CY-30-18*up);ctx.clip();ctx.fillStyle=hc;ctx.strokeStyle='#3b2a20';ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(CX,CY-6,FRX+7,FRY+4,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
  if(c.ribbon){ctx.fillStyle='#ff5a8a';const rx=CX+46,ry=CY-62;
   [[1],[-1]].forEach(([d])=>{ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+d*22,ry-14);ctx.lineTo(rx+d*22,ry+14);ctx.closePath();ctx.fill();ctx.stroke()});
   ctx.beginPath();ctx.arc(rx,ry,7,0,Math.PI*2);ctx.fill();ctx.stroke()}}
 S.strands.forEach(s=>{if(len(s)>0&&inFront(s,S))strokeStrand(ctx,pts(s,S),hc,S.wet)});
 S.pieces.forEach(pc=>strokeStrand(ctx,pc.p,hc,0));
 ctx.lineWidth=2.5;S.bubbles.forEach(b=>{ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle='#9ec9e8';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(158,201,232,.6)';ctx.beginPath();ctx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.25,0,Math.PI*2);ctx.fill()});
 S.parts.forEach(p=>{ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
  if(p.k==='drop'){ctx.fillStyle='#4aa8ff';ctx.beginPath();ctx.ellipse(p.x,p.y,2.5,5.5,0,0,Math.PI*2);ctx.fill()}
  else if(p.k==='wind'){ctx.strokeStyle='#8fa3b5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*4,p.y-p.vy*4);ctx.stroke()}
  else{ctx.fillStyle='#ffc93b';ctx.font='18px sans-serif';ctx.fillText('✦',p.x-6,p.y+6)}
  ctx.globalAlpha=1});
 if(S.say&&S.say.life>0){ctx.globalAlpha=Math.min(1,S.say.life/15);ctx.font='800 20px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';
  const tw=ctx.measureText(S.say.text).width,bw=tw+26,bx=Math.min(W-bw-6,CX+30),by=12;
  ctx.fillStyle='#fff';ctx.strokeStyle='#3b2a20';ctx.lineWidth=3;ctx.beginPath();(ctx.roundRect?ctx.roundRect(bx,by,bw,38,16):ctx.rect(bx,by,bw,38));ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx+20,by+37);ctx.lineTo(bx+8,by+54);ctx.lineTo(bx+34,by+37);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(bx+18,by+33,18,4);ctx.fillStyle='#ff5a8a';ctx.fillText(S.say.text,bx+13,by+26);ctx.globalAlpha=1}}

// ---- sound ----
let ac=null,noiseBuf=null,loopNodes=null,lastSnip=0;
function A(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
 const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ac.state==='suspended')ac.resume();return ac}
function noise(){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;return s}
function filt(type,f,q){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b}
function gain(v){const g=ac.createGain();g.gain.value=v;return g}
function startLoop(kind){stopLoop();try{A();const t=ac.currentTime,out=ac.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(1,t+.06);out.connect(ac.destination);const src=[];
 if(kind==='shower'){const n=noise();n.connect(filt('highpass',1600)).connect(gain(.2)).connect(out);
  const n2=noise();n2.connect(filt('bandpass',5000,1)).connect(gain(.12)).connect(out);src.push(n,n2)}
 if(kind==='dryer'){const n=noise();n.connect(filt('lowpass',1100)).connect(gain(.35)).connect(out);
  const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=135;o.connect(filt('lowpass',600)).connect(gain(.05)).connect(out);src.push(n,o)}
 if(kind==='razor'){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=105;const am=gain(.06);o.connect(filt('bandpass',1300,.8)).connect(am).connect(out);
  const lfo=ac.createOscillator();lfo.frequency.value=22;const lg=gain(.03);lfo.connect(lg).connect(am.gain);
  const n=noise();n.connect(filt('bandpass',3200,2)).connect(gain(.08)).connect(out);src.push(o,lfo,n)}
 src.forEach(s=>s.start(t));loopNodes={out,src}}catch(e){}}
function stopLoop(){if(!loopNodes)return;const{out,src}=loopNodes;loopNodes=null;
 try{const t=ac.currentTime;out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(out.gain.value,t);out.gain.linearRampToValueAtTime(0,t+.08);src.forEach(s=>s.stop(t+.1))}catch(e){}}
function burst(t,f,dur,g){const n=ac.createBufferSource();n.buffer=noiseBuf;const gg=ac.createGain();gg.gain.setValueAtTime(g,t);gg.gain.exponentialRampToValueAtTime(.001,t+dur);
 n.connect(filt('bandpass',f,1.4)).connect(gg).connect(ac.destination);n.start(t,Math.random());n.stop(t+dur+.02)}
function snip(){const now=performance.now();if(now-lastSnip<260)return;lastSnip=now;
 try{A();const t=ac.currentTime;burst(t,4300,.045,.9);burst(t+.12,3700,.05,.9)}catch(e){}}
function pop(){try{A();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(980,t+.08);
 g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.16)}catch(e){}}
let lastSay=-1e9;
function say(kind){const now=performance.now();if(now-lastSay<1800)return;lastSay=now;const text=LINES[kind];st.say={text,life:80,sad:kind==='razor'};
 try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace('！',''));
  u.lang='ja-JP';if(kind==='razor')u.text='やめてー';u.pitch=st.c.voice.p;u.rate=st.c.voice.r;u.volume=1;
  const jv=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace('_','-').startsWith('ja'));if(jv)u.voice=jv;speechSynthesis.speak(u)}catch(e){}}
// ---- BGM (original tune) ----
const BN={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99,A:880,c:1046.5};
const MEL='EGAGECDE GAcAGEDC EGAGECDE DEGEDCC_'.replace(/ /g,'');
const BASS=[130.81,174.61,196,130.81];
let bgmOn=false,bgmTimer=null,beat=0;const BEAT=.3;
function tone(f,dur,vol,type){const t=ac.currentTime,g=ac.createGain(),o=ac.createOscillator();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05)}
function bgmStep(){if(!bgmOn)return;try{const ch=MEL[beat%MEL.length];if(BN[ch]){tone(BN[ch],.5,.05,'sine');tone(BN[ch]*2,.25,.012,'triangle')}
 if(beat%4===0)tone(BASS[Math.floor(beat/8)%4],.55,.05,'triangle')}catch(e){}beat++;bgmTimer=setTimeout(bgmStep,BEAT*1000)}
function setBgm(on){bgmOn=on;clearTimeout(bgmTimer);if(on){try{A()}catch(e){bgmOn=false}if(bgmOn){beat=0;bgmStep()}}
 document.querySelectorAll('.musicbtn').forEach(b=>b.setAttribute('aria-pressed',bgmOn))}
document.querySelectorAll('.musicbtn').forEach(b=>b.onclick=()=>setBgm(!bgmOn));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&bgmOn)setBgm(false)});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

// ---- picker ----
const cards=document.getElementById('cards');
CUST.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='card';b.id='cust-'+i;
 const cv=document.createElement('canvas');cv.width=300;cv.height=380;b.appendChild(cv);
 const sp=document.createElement('span');sp.textContent=c.name;b.appendChild(sp);
 const x=cv.getContext('2d');x.fillStyle='#f4fbff';x.fillRect(0,0,W,H);draw(x,newState(i));
 b.onclick=()=>{pop();start(i)};cards.appendChild(b)});

// ---- play ----
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),glass=document.getElementById('glass');
let tool='shampoo',scale=1,running=false,down=false,last=null,raf=0;
const toolsEl=document.getElementById('tools');
TOOLS.forEach(([k,ic,lb])=>{const b=document.createElement('button');b.type='button';b.className='tool';b.id='tool-'+k;
 b.innerHTML='<b>'+ic+'</b><small>'+lb+'</small>';b.setAttribute('aria-pressed',k===tool);
 b.onclick=()=>{tool=k;stopLoop();[...toolsEl.children].forEach(x=>x.setAttribute('aria-pressed',x===b));pop()};toolsEl.appendChild(b)});

function fit(){const r=glass.getBoundingClientRect();if(!r.width)return;scale=Math.min(r.width/W,r.height/H);
 const dpr=window.devicePixelRatio||1;cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
 ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0)}
window.addEventListener('resize',fit);

function start(i){st=newState(i);document.getElementById('pick').hidden=true;document.getElementById('play').hidden=false;
 document.getElementById('cname').textContent=CUST[i].name;document.getElementById('fin').hidden=true;document.getElementById('yay').innerHTML='';
 fit();if(!running){running=true;loop()}}
function toPick(){running=false;stopLoop();cancelAnimationFrame(raf);document.getElementById('play').hidden=true;document.getElementById('pick').hidden=false}
document.getElementById('back').onclick=toPick;
document.getElementById('other').onclick=toPick;
document.getElementById('again').onclick=()=>start(st.idx);
document.getElementById('finish').onclick=()=>{if(!st||st.happy)return;st.happy=true;st.bubbles=[];stopLoop();pop();
 document.getElementById('fin').hidden=false;const y=document.getElementById('yay');y.innerHTML='';
 for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=['⭐','✨','💖','🌸'][i%4];s.style.left=Math.random()*90+'%';s.style.animationDelay=Math.random()*.8+'s';y.appendChild(s)}};

function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/scale,(e.clientY-r.top)/scale]}
cv.addEventListener('pointerdown',e=>{if(!st||st.happy)return;down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}
 last=pos(e);A();if(['shampoo','shower','dryer'].includes(tool))say(tool);if(['shower','dryer','razor'].includes(tool))startLoop(tool);act(last,last)});
cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);act(last,p);last=p});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,()=>{down=false;stopLoop()}));

function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));
 return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))}
const toward=(v,t,k)=>v+(t-v)*k;

function cutAt(a,b,radius){const S=st,now=performance.now();let hit=false;
 S.strands.forEach(s=>{if(s.stage>=5||now-s.last<280)return;const p=pts(s,S);
  if(!p.some(q=>segDist(q,a,b)<radius))return;
  if(tool==='razor'&&s.layer!=='beard')say('razor');
  const keep=Math.floor(len({L0:s.L0,stage:s.stage+1})/STEP);
  const off=p.slice(keep);if(off.length>1&&S.pieces.length<90)S.pieces.push({p:off.map(q=>[q[0],q[1]]),vy:.5,vx:(Math.random()-.5)*2});
  s.stage++;s.last=now;hit=true});
 return hit}

function act(a,b){const S=st,[x,y]=b;
 if(tool==='shampoo'){
  for(let i=0;i<2;i++){if(S.bubbles.length>=170)S.bubbles.shift();
   let ang=Math.atan2(y-(CY-8),x-CX);ang=Math.max(-Math.PI+.3,Math.min(-.3,ang))+(Math.random()-.5)*.35;
   const r=FRX+2+Math.random()*26;S.bubbles.push({x:CX+Math.cos(ang)*r,y:CY-8+Math.sin(ang)*r*1.08,r:6+Math.random()*10})}}
 else if(tool==='shower'){S.bubbles=S.bubbles.filter(q=>Math.abs(q.x-x)>38||q.y<y-30);S.wet=Math.min(1,S.wet+.03);
  S.w=toward(S.w,0,.06);S.bangDir=toward(S.bangDir,HALF,.06);
  for(let i=0;i<3;i++)S.parts.push({k:'drop',x:x+(Math.random()-.5)*44,y:y-8,vx:0,vy:5+Math.random()*3,life:1.4})}
 else if(tool==='dryer'){S.wet=Math.max(0,S.wet-.012);
  const top=y<CY-FRY+12&&Math.abs(x-CX)<55, left=x<CX-35, right=x>CX+35;
  if(top){S.bangDir=toward(S.bangDir,-HALF,.07);S.w=toward(S.w,0,.05)}
  else if(left){S.w=toward(S.w,1,.06);S.bangDir=toward(S.bangDir,HALF-.95,.07)}
  else if(right){S.w=toward(S.w,-1,.06);S.bangDir=toward(S.bangDir,HALF+.95,.07)}
  S.strands.forEach(s=>{const p=pts(s,S);if(p.some((q,i)=>i%3===0&&Math.hypot(q[0]-x,q[1]-y)<70))s.flut=1});
  const dx=CX-x,dy=(CY-20)-y,dl=Math.hypot(dx,dy)||1;
  S.parts.push({k:'wind',x,y:y+(Math.random()-.5)*20,vx:dx/dl*6,vy:dy/dl*6,life:.9})}
 else if(tool==='scissors'){snip();cutAt(a,b,14)}
 else if(tool==='razor'){if(cutAt(a,b,22))S.parts.push({k:'spark',x,y,vx:0,vy:-1,life:1})}}

function loop(){if(!running)return;const S=st;S.t++;
 S.strands.forEach(s=>s.flut*=.975);
 if(S.wet>.3&&S.t%9===0){const hs=S.strands.filter(s=>len(s)>20);if(hs.length){const s=hs[Math.floor(Math.random()*hs.length)];const p=pts(s,S);const q=p[p.length-1];S.parts.push({k:'drop',x:q[0],y:q[1],vx:0,vy:2.5,life:1})}}
 S.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.k==='drop')p.vy+=.15;p.life-=.03});S.parts=S.parts.filter(p=>p.life>0);
 S.pieces.forEach(pc=>{pc.vy+=.35;pc.p.forEach(q=>{q[0]+=pc.vx;q[1]+=pc.vy})});S.pieces=S.pieces.filter(pc=>pc.p.some(q=>q[1]<H+20));
 if(S.say)S.say.life--;
 ctx.clearRect(0,0,W,H);draw(ctx,S);raf=requestAnimationFrame(loop)}
</script>
</body>
